name: deploy vue

on:
  push:
    branches:
      - prod

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
      - name: check out the code to build server
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/vue3-realworld .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/vue3-realworld

      - name: Deploy container on VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/vue3-realworld
            docker stop vue3-realworld || true
            docker rm vue3-realworld || true
            docker run -d -p 8100:80 --name vue3-realworld ${{ secrets.DOCKER_USERNAME }}/vue3-realworld